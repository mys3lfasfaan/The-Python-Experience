    <link rel="icon" href="favicon.ico" type="image/x-icon">

<body>
    <header>
        <h1>Contact Us</h1>
        <nav>
            <ul>
                <li><a href="/freecodecamp/miniproj/index.html#Home">Home</a></li>
                <li><a href="/freecodecamp/miniproj/index.html#about">About LTS</a></li>

        <figure>
            <img src="something" alt="Little Taco Shop Tacos">
            <figcaption>
                Little Taco Shop Tacos
            </figcaption>
        </figure>
    </header>
    <hr>
    <main>

        <h2>Our Contact Form</h2>
        <form action="https://httpbin.org/post" method="post">
            <fieldset>
                <legend>Send Us a Message</legend>
                <p>
                    <label for="name">Name: </label>
                    <input type="text" name="name" id="name" placeholder="Your Name">
                </p>
                <p>
                    <label for="email">Email: </label>
                    <input type="email" name="email" id="email" placeholder="Your Email">
                </p>
                <label for="message">Message: </label>
                <p>
                    <textarea name="message" id="message" cols="30" rows="10"></textarea>
                </p>
            </fieldset>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </form>
        <h2>Our Location</h2>
        <address>555 Taco Temptation Lane, Suite T <br>
            Kansas City, MO 555-555-5555
        </address>
        <em>Phone: <a href="tel:+5555555555">555-555-5555</a></em>
        <br>
        <br>
        <a href="#">Back to Top</a>
        <hr>
    </main>
    <footer>
        Copyright &copy; The Little Taco Shop
    </footer>
</body>
